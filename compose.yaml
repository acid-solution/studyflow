services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s

  # A pure cache: persistence is deliberately off. Losing it costs a round of
  # misses, and because the generation counters live in the same instance as the
  # data they guard, a restart can never resurrect a stale entry. The idempotency
  # receipts are in MySQL, so those survive.
  redis:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        VITE_AUTH_URL: ${PUBLIC_AUTH_URL:-http://127.0.0.1:18082}
        VITE_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:8081}
    restart: unless-stopped
    environment:
      PORT: "8081"
      # A container has to accept connections from outside itself, so it binds all
      # interfaces. Local runs default to loopback and never need a firewall rule.
      APP_HOST: 0.0.0.0
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=UTC"
      MIGRATIONS_DIR: migrations
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:18082/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-shared-auth}
      AUTH_AUDIENCE: studyflow
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8081}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      REDIS_ADDR: redis:6379
      CACHE_TTL: ${CACHE_TTL:-30s}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      # The bundled redis has no password, so REDIS_PASSWORD is deliberately not
      # passed here: setting it would make the client send an AUTH the server
      # rejects, and caching would silently switch itself off. It is only for an
      # external Redis that requires one.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
