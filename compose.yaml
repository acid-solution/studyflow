services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s

  api:
    build:
      context: .
      args:
        VITE_AUTH_URL: ${PUBLIC_AUTH_URL:-http://127.0.0.1:18082}
        VITE_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:8081}
    restart: unless-stopped
    environment:
      PORT: "8081"
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=UTC"
      MIGRATIONS_DIR: migrations
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:18082/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-shared-auth}
      AUTH_AUDIENCE: studyflow
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8081}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
